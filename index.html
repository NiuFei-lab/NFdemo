<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛菲的第一个网页</title>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', sans-serif;
        }
        .card {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-10px); }
        h1 { color: #2d3436; margin-top: 0; font-size: 2.5rem; }
        p { color: #636e72; font-size: 1.1rem; line-height: 1.6; }
        .tag {
            background: #e1f5fe;
            color: #039be5;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 20px;
        }
        .footer { margin-top: 2rem; font-size: 0.8rem; color: #b2bec3; }
    </style>
</head>
<body>
    <div class="card">
        <div class="tag">你好，世界！</div>
        <h1>你好，我是牛菲</h1>
        <p>这是我利用 GitHub Pages 发布的第一个个人网页。✨</p>
        <p>我已经成功掌握了 Git 的核心技能，从此开启程序员的代码之旅！</p>
        <div class="footer">由 GitHub Pages 强力驱动 | 2026</div>
    </div>
</body>
</html>
